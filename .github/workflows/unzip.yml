name: Giai nen ZIP
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen
        run: |
          set -e
          zip=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$zip" ]; then echo "Khong co file zip"; exit 0; fi
          mkdir /tmp/x
          unzip -q "$zip" -d /tmp/x
          if [ "$(ls /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            cp -a "/tmp/x/$(ls /tmp/x)/." .
          else
            cp -a /tmp/x/. .
          fi
          rm -f "$zip"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Giai nen ZIP" || exit 0
          git push
